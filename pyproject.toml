[project]
name = "fanus"
version = "0.1.0"
description = "An offline-first study manager & planner designed for old hardwares"
readme = "README.md"
requires-python = ">=3.8.10"
dependencies = [
    "PyQt5==5.15.9",
    "PyQt5-Qt5==5.15.2",
    "peewee==3.17.0",
    "xgboost>=2.1.4",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "PyInstaller==5.13.2",
]
train = [
    "xgboost>=1.7.0",
    "scikit-learn>=1.3.0",
    "m2cgen>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.ruff]
target-version = "py38"
line-length = 100

exclude = [
    ".git",
    "build",
    "dist",
    "__pycache__",
    "src/models/model_inference.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
combine-as-imports = true
